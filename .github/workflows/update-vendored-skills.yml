name: Update vendored skills

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-vendored-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update vendored sources
        run: python3 tools/sync_sources.py --update --report "$RUNNER_TEMP/update-summary.md"
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream updates."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit update branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          branch="automation/update-vendored-skills"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A sources.json skills agents
          git commit -m "Update vendored skills from upstream"
          git push --force-with-lease origin "$branch"
      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/update-vendored-skills
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_TITLE: Update vendored skills from upstream
        run: |
          body_file="$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/update-summary.md" > "$body_file"
          {
            echo
            echo "This PR was generated by the scheduled vendored skills update workflow."
            echo "Vendored files are generated from \`sources.json\`; review upstream changes before merging."
          } >> "$body_file"

          pr_number="$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body-file "$body_file"
          else
            gh pr create --head "$BRANCH" --base "$BASE_BRANCH" --title "$PR_TITLE" --body-file "$body_file"
          fi
