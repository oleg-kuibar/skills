name: Check skills

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/sync_sources.py --selftest
      - run: python3 tools/sync_sources.py --check
      - run: python3 skills/park/scripts/handoff-pickup.py --selftest
      - run: python3 skills/park/scripts/grade-handoff.py --selftest
      - run: DISABLE_TELEMETRY=1 npx --yes skills add . --list
